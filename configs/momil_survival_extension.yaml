epochs: 200
lr: 0.0001
weight_decay: 0.00001
grad_clip: null
selection_metric: c_index
patience: 20
model:
  hidden: 512
  layers: 2
  state_size: 64
  dropout: 0.25
  activation: relu
  backend: torch
  scan_chunk: 64
  early_stopping: true
  weighted_sampling: true
  accumulation_steps: 32
  bins: 4
  alpha: 0.0
  l1_weight: 0.0
