epochs: 50
patience: 10
lr: 0.0001
weight_decay: 0.0005
grad_clip: 1.0
selection_metric: reco_joint
model:
  hidden: 512
  prototypes: 128
  enhancers: 3
  dropout: 0.25
  warmup_epochs: 12
  freeze_epochs: 12
  tau_start: 1.2
  tau_end: 0.7
  tau_epochs: 35
  label_smoothing: 0.03
  lambda_ortho: 0.02
  use_frequencies: false
  clustering_seed: 2025
  cluster_batch_size: 4096
  cluster_iterations: 200
